name: tests

# The kit installs onto Windows machines and compares some files by SHA-256, so the
# suite must run on Windows. This exists because a config-clobbering bug (v1.6.1 shipped
# a fix for it) reached a release with a green local suite: the custom-config test used a
# fixture that could not trigger the code path under test.
#
# Everything here runs read-only against a temp root; no workflow step installs tooling
# or touches the runner's real ~/.codex.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # v4.2.2; keep the action immutable and update this SHA deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: PowerShell syntax check
        shell: pwsh
        run: ./tests/Test-ScriptSyntax.ps1

      - name: No hardcoded user paths
        shell: pwsh
        run: ./tests/Test-NoHardcodedPaths.ps1

      - name: Install surface and config ownership
        shell: pwsh
        run: ./tests/Test-InstallSurface.ps1

      - name: Elevated helper trusted-path gate (behavioural)
        shell: pwsh
        run: ./tests/Test-HelperTrust.ps1

      - name: Elevated helper queue and refresh behavior
        shell: pwsh
        run: ./tests/Test-HelperRuntime.ps1

      # Best-effort: install the Codex CLI so Test-CommandRules can run its real
      # execpolicy allow/sensitivity checks. If this does not produce a `codex` on
      # PATH, the test reports those two checks as INFO and still passes, so a hiccup
      # here never reds the suite. Pin @openai/codex to a reviewed version once the
      # npm-version-to-CLI-version mapping is confirmed on a runner.
      - name: Install Codex CLI (best effort, for execpolicy checks)
        continue-on-error: true
        shell: pwsh
        run: npm install -g @openai/codex

      - name: Command rules (discovery, BOM-free, ownership, execpolicy)
        shell: pwsh
        run: ./tests/Test-CommandRules.ps1

      - name: Config reconcile (autonomy keys set in place, rest preserved)
        shell: pwsh
        run: ./tests/Test-ConfigReconcile.ps1

      - name: Capability harness
        shell: pwsh
        run: ./tests/Test-AutonomyKit.ps1
