name: tests

# The kit installs onto Windows machines and compares some files by SHA-256, so the
# suite must run on Windows. This exists because a config-clobbering bug (v1.6.1 shipped
# a fix for it) reached a release with a green local suite: the custom-config test used a
# fixture that could not trigger the code path under test.
#
# Everything here runs read-only against a temp root; no workflow step installs tooling
# or touches the runner's real ~/.codex.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # v4.2.2; keep the action immutable and update this SHA deliberately.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: PowerShell syntax check
        shell: pwsh
        run: ./tests/Test-ScriptSyntax.ps1

      - name: No hardcoded user paths
        shell: pwsh
        run: ./tests/Test-NoHardcodedPaths.ps1

      - name: Install surface and config ownership
        shell: pwsh
        run: ./tests/Test-InstallSurface.ps1

      - name: Elevated helper trusted-path gate (behavioural)
        shell: pwsh
        run: ./tests/Test-HelperTrust.ps1

      - name: Elevated helper queue and refresh behavior
        shell: pwsh
        run: ./tests/Test-HelperRuntime.ps1

      - name: Capability harness
        shell: pwsh
        run: ./tests/Test-AutonomyKit.ps1
