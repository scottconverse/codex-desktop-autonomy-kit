<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex Desktop Autonomy Kit architecture</title>
  <desc id="desc">Architecture diagram showing the user, double-click launchers, setup and doctor scripts, Codex configuration, toolchain installation, and elevated helper flow.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1220" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <rect x="38" y="38" width="1204" height="684" rx="28" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="72" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Codex Desktop Autonomy Kit</text>
  <text x="72" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Click-first install path, persistent Codex configuration, development toolchain, and bounded elevation for Windows.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="178" width="210" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="102" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Developer</text>
    <text x="102" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Double-clicks launchers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="372" y="160" width="250" height="150" rx="12" fill="#eff6ff" stroke="#2563eb"/>
    <text x="402" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Click Wrappers</text>
    <text x="402" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Install-Autonomy.cmd</text>
    <text x="402" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Doctor-Autonomy.cmd</text>
    <text x="402" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Uninstall / Refresh / Tests</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="734" y="160" width="230" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="764" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Setup Layer</text>
    <text x="764" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Stages profiles</text>
    <text x="764" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Merges config safely</text>
    <text x="764" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Installs user tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="160" width="190" height="150" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="1040" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Doctor</text>
    <text x="1040" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Read-only status</text>
    <text x="1040" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Version parity</text>
    <text x="1040" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Helper checks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="150" y="430" width="280" height="170" rx="12" fill="#f8fafc" stroke="#64748b"/>
    <text x="180" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Codex Profile</text>
    <text x="180" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">~/.codex/config.toml</text>
    <text x="180" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">~/.codex/autonomy-kit</text>
    <text x="180" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Compact and full instructions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="430" width="270" height="170" rx="12" fill="#f8fafc" stroke="#64748b"/>
    <text x="530" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Toolchain</text>
    <text x="530" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Python, uv, Node</text>
    <text x="530" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">GitHub CLI, ripgrep, jq</text>
    <text x="530" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">SQLite and Playwright</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="430" width="290" height="170" rx="12" fill="#fefce8" stroke="#ca8a04"/>
    <text x="870" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Elevated Helper</text>
    <text x="870" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">One-time UAC approval</text>
    <text x="870" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Scheduled task runs highest</text>
    <text x="870" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Structured jobs and logs</text>
  </g>

  <path d="M282 234 H372" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M622 234 H734" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M964 234 H1010" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M818 310 C745 372 485 360 314 430" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M848 310 C798 370 706 378 652 430" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M878 310 C930 366 958 380 982 430" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M1105 310 C1105 356 1068 385 1018 430" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  <rect x="72" y="650" width="1130" height="38" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="96" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Normal path: double-click Install, restart Codex Desktop, ask Codex to work. Maintenance path: double-click Doctor, Refresh Helper, Run Tests, or Uninstall.</text>
</svg>
